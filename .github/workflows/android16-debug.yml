name: Android 16 Debug APK

on:
  push:
    branches:
      - android16
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Android 16 compatibility patch
        run: python3 scripts/android16_patch.py

      - name: Persist patched sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            libs.versions.toml \
            gradle/wrapper/gradle-wrapper.properties \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/github/jing332/tts_server_android/compose/systts/list/ui/BgmConfigUI.kt \
            app/src/main/java/com/github/jing332/tts_server_android/ui/FilePickerActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m "Apply Android 16 compatibility changes"
            git push origin HEAD:android16
          else
            echo "Android 16 source changes are already committed."
          fi

      - name: Create temporary signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android16-debug.jks" \
            -storepass android16 \
            -keypass android16 \
            -alias android16 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TTS Server Android16 Debug, OU=CI, O=Local, L=Local, S=Local, C=US"

          cat > local.properties <<EOF
          KEY_PATH=$GITHUB_WORKSPACE/android16-debug.jks
          KEY_PASSWORD=android16
          ALIAS_NAME=android16
          ALIAS_PASSWORD=android16
          EOF

      - name: Verify patch
        shell: bash
        run: |
          grep -n 'compileSdk = "36"' libs.versions.toml
          grep -n 'targetSdk = "35"' libs.versions.toml
          grep -n 'agp = "8.10.1"' libs.versions.toml
          grep -n 'gradle-8.11.1-bin.zip' gradle/wrapper/gradle-wrapper.properties
          git diff --check

      - name: Build dev debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDevDebug --stacktrace --warning-mode all

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TTS-Server-Android16-Debug
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error